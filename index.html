<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of Aethon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header id="hdr">
    <div class="logo">⚔ Echoes of Aethon</div>
    <div class="hstats">
      <div class="bw">
        <span class="blabel hp-label">HP</span>
        <div class="bar"><div class="bf hp-f" id="hpbar"></div></div>
        <span class="bv" id="hpval"></span>
      </div>
      <div class="bw">
        <span class="blabel mp-label">MP</span>
        <div class="bar"><div class="bf mp-f" id="mpbar"></div></div>
        <span class="bv" id="mpval"></span>
      </div>
      <span id="hgold"></span>
      <span id="htime" style="font-size:10px;color:#aabb88"></span>
      <span id="hloc"></span>
    </div>
    <div style="display:flex;gap:5px">
      <button class="btn" style="font-size:10px;padding:3px 8px" onclick="saveGame()">💾 Save</button>
      <button class="btn" style="font-size:10px;padding:3px 8px" onclick="loadGame()">📂 Load</button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab on" data-v="explore"   onclick="sv('explore')">⚔ Explore</button>
    <button class="tab"    data-v="skills"    onclick="sv('skills')">🎓 Skills</button>
    <button class="tab"    data-v="inventory" onclick="sv('inventory')">🎒 Items</button>
    <button class="tab"    data-v="spellbook" onclick="sv('spellbook')">📖 Spells</button>
    <button class="tab"    data-v="quests"    onclick="sv('quests')">📋 Quests</button>
    <button class="tab"    data-v="map"       onclick="sv('map')">🗺 Map</button>
    <button class="tab"    data-v="factions"  onclick="sv('factions')">⚑ Factions</button>
  </nav>

  <div id="body">
    <main id="main"></main>
    <aside id="side">
      <div id="sinfo"></div>
      <div id="slog"></div>
    </aside>
  </div>

</div>

<!-- DATA — order matters -->
<script src="js/data/abilities.js"></script>
<script src="js/data/spells.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/areas.js"></script>
<script src="js/data/areas_patch.js"></script>
<script src="js/data/npcs.js"></script>
<script src="js/data/npcs_extra.js"></script>
<script src="js/data/quests.js"></script>
<script src="js/data/quests_extra.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/data/maps_extended.js"></script>
<script src="js/data/maps_phase3.js"></script>
<script src="js/data/maps_phase4.js"></script>
<script src="js/data/maps_phase5.js"></script>

<!-- ENGINE — order matters -->
<script src="js/engine/input.js"></script>
<script src="js/engine/camera.js"></script>
<script src="js/engine/tilemap.js"></script>
<script src="js/engine/player.js"></script>
<script src="js/engine/engine.js"></script>


<!-- SYSTEMS — order matters -->
<script src="js/audio.js"></script>
<script src="js/systems/state.js"></script>
<script src="js/systems/time.js"></script>
<script src="js/systems/reputations.js"></script>
<script src="js/systems/skills.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/dialogue.js"></script>
<script src="js/systems/inventory.js"></script>
<script src="js/systems/movements.js"></script>
<script src="js/systems/quests.js"></script>
<script src="js/systems/save.js"></script>

<!-- UI — order matters, render.js must be last -->
<script src="js/ui/render_explore.js"></script>
<script src="js/ui/render_combats.js"></script>
<script src="js/ui/render_dialogues.js"></script>
<script src="js/ui/render_inventory.js"></script>
<script src="js/ui/render_skills.js"></script>
<script src="js/ui/render_spells.js"></script>
<script src="js/ui/render_quests.js"></script>
<script src="js/ui/render_maps.js"></script>
<script src="js/ui/render_factions.js"></script>
<script src="js/ui/render_saves.js"></script>
<script src="js/ui/render.js"></script>

<!-- ENTRY -->
<script src="main.js"></script>

</body>
</html>
